.shadow-sm{

}

.shadow-xl{

  --tw-shadow-colored: 0 20px 25px -5px var(--tw-shadow-color), 0 8px 10px -6px var(--tw-shadow-color);

.shadow-black\/50{

}

.shadow-red-500\/30{

.outline-none{

:root{
  --bg:#0A0F0D;
  --surface:#121A17;
  --surface-2:#18251F;
  --line:rgba(255,255,255,.10);
  --text:#F7FFF9;
  --muted:#A7B8B0;
  --red:#E11D2E;
  --red-2:#FF2E3E;
  --emerald:#00C896;
  --emerald-2:#10B981;
}

*{
  box-sizing:border-box
}

html{
  scrollbar-color:#24382f #0A0F0D
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif
}

.font-display{
  font-family:'Unbounded','Manrope',sans-serif
}

.glass{
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  border:1px solid var(--line);
  backdrop-filter:blur(18px)
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

input[type=range]{
  -webkit-appearance:none;
  -moz-appearance:none;
       appearance:none;
  height:5px;
  border-radius:99px;
  background:linear-gradient(to right,var(--emerald) var(--fill,0%),rgba(255,255,255,.18) var(--fill,0%));
  outline:none;
  cursor:pointer
}

input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#fff;
  border:4px solid var(--red);
  box-shadow:0 3px 12px rgba(0,0,0,.5);
  cursor:pointer
}

input[type=range]::-moz-range-thumb{
  width:16px;
  height:16px;
  border-radius:50%;
  background:#fff;
  border:4px solid var(--red)
}

@keyframes eq{
  0%,100%{
    transform:scaleY(.25)
  }

  50%{
    transform:scaleY(1)
  }
}

.eq-bar{
  transform-origin:bottom;
  animation:eq .85s ease-in-out infinite
}

.eq-paused .eq-bar{
  animation-play-state:paused;
  transform:scaleY(.25)
}

@keyframes float{
  0%,100%{
    transform:translateY(0) rotate(0)
  }

  50%{
    transform:translateY(-10px) rotate(2deg)
  }
}

.float-slow{
  animation:float 5s ease-in-out infinite
}

@keyframes pulse-ring{
  0%{
    box-shadow:0 0 0 0 rgba(0,200,150,.35)
  }

  100%{
    box-shadow:0 0 0 18px rgba(0,200,150,0)
  }
}

.pulse-ring{
  animation:pulse-ring 1.8s ease-out infinite
}

@keyframes splash-letter{
  0%{
    opacity:0;
    transform:translateY(26px) scale(.94);
    filter:blur(6px)
  }

  60%{
    opacity:1;
    filter:blur(0)
  }

  100%{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0)
  }
}

.splash-letter{
  display:inline-block;
  opacity:0;
  animation:splash-letter .75s cubic-bezier(.2,.8,.2,1) forwards;
  text-shadow:0 0 28px rgba(0,200,150,.45),0 0 60px rgba(225,29,46,.28)
}

@keyframes splash-drift{
  0%,100%{
    transform:translate(0,0) scale(1)
  }

  50%{
    transform:translate(24px,-18px) scale(1.12)
  }
}

@keyframes splash-drift-2{
  0%,100%{
    transform:translate(0,0) scale(1)
  }

  50%{
    transform:translate(-28px,20px) scale(1.08)
  }
}

.splash-drift{
  animation:splash-drift 6s ease-in-out infinite
}

.splash-drift-2{
  animation:splash-drift-2 7s ease-in-out infinite
}

@keyframes splash-line{
  from{
    transform:scaleX(0);
    opacity:0
  }

  to{
    transform:scaleX(1);
    opacity:1
  }
}

.splash-line{
  transform-origin:center;
  animation:splash-line .8s .9s cubic-bezier(.2,.8,.2,1) both
}

@keyframes splash-fade-up{
  from{
    opacity:0;
    transform:translateY(12px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.splash-fade-up{
  animation:splash-fade-up .7s 1s ease-out both
}

.splash-fade-up-late{
  animation:splash-fade-up .7s 1.4s ease-out both
}

@keyframes splash-eq{
  0%,100%{
    transform:scaleY(.25)
  }

  50%{
    transform:scaleY(1)
  }
}

.splash-eq{
  transform-origin:bottom;
  animation:splash-eq .8s ease-in-out infinite
}

.splash-leaving{
  opacity:0;
  transform:scale(1.015);
  transition:opacity .55s ease,transform .55s ease;
  pointer-events:none
}

.splash-visible{
  transition:opacity .55s ease,transform .55s ease
}

[data-theme="light"] input[type=range]{
  background:linear-gradient(to right,var(--emerald) var(--fill,0%),rgba(0,0,0,.14) var(--fill,0%))
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A0F0D;
    --surface:#121A17;
    --text:#F7FFF9
  }
}

.placeholder\:text-current::-moz-placeholder{
  color: currentColor;
}

.placeholder\:text-current::placeholder{
  color: currentColor;
}

.placeholder\:opacity-40::-moz-placeholder{
  opacity: 0.4;
}

.placeholder\:opacity-40::placeholder{
  opacity: 0.4;
}

@media (min-width: 640px){
  .sm\:w-\[4px\]{
    width: 4px;
  }
}
